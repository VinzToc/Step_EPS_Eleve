<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StepSuivi – Carnet d'entraînement</title>
<meta name="theme-color" content="#5b21b6"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192-stepeps-eleve.png"><link rel="stylesheet" href="css/style.css">
<style id="titre-moderne">/* Titre en casse mixte + logo mis en valeur, aux couleurs du logo */
header h1{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important;font-style:italic!important;font-weight:900!important;text-transform:none!important;letter-spacing:.005em!important;line-height:1.08;font-size:2.1rem!important;background:none!important;-webkit-text-stroke:0!important;color:#fff!important;-webkit-text-fill-color:#fff!important;text-shadow:0 2px 0 #2a0a6b,0 4px 12px rgba(0,0,0,.45)!important}
header h1 .tm{background:linear-gradient(180deg,#ffe3f7,#ff8ad8 72%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:#ff8ad8!important;-webkit-text-fill-color:transparent!important;text-shadow:none!important;filter:drop-shadow(0 2px 0 #2a0a6b)}
header h1 small,header h1 em{font-style:normal!important;text-shadow:none!important;-webkit-text-fill-color:currentColor!important}
header img{border-radius:50%!important;box-shadow:0 0 0 3px #ff8ad8,0 0 22px rgba(255,138,216,.5),0 6px 16px rgba(0,0,0,.4)!important;transition:transform .3s}
header img:hover{transform:rotate(-5deg) scale(1.05)}
@media(max-width:520px){header h1{font-size:calc(2.1rem * .8)!important}}
</style>
</head>
<body><header><img src="icons/icon-stepeps-eleve.png" alt="Logo Step EPS"><div><h1>Step<span class="tm">Suivi</span></h1><p>Mon carnet d'entraînement</p></div></header>
<main id="app"></main><nav><button data-t="s">Séance</button><button data-t="c">Carnet</button></nav>
<p style="text-align:center;margin:20px"><small>Données stockées uniquement sur cet appareil</small></p>
<script src="js/common.js"></script><script src="eps-core.js"></script><script src="js/eleve.js"></script></body></html>
